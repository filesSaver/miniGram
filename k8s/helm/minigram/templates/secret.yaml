# ── Secrets ───────────────────────────────────────────────────────────────────
#
# WHY: Kubernetes Secrets store sensitive values separately from your app config.
# They are base64-encoded (NOT encrypted by default) and injected into pods
# as environment variables. This keeps credentials out of values.yaml and
# therefore out of your git history.
#
# !! IMPORTANT: Fill in REAL values before running helm install !!
# !! DO NOT commit this file with real secrets to git !!
#
# HOW TO ENCODE: echo -n "your-value" | base64
#
# FIELDS:
#   JWT_SECRET       — random string used to sign/verify login tokens
#   POSTGRES_USER    — PostgreSQL username (e.g. minigram)
#   POSTGRES_PASSWORD — PostgreSQL password (choose something strong)
#   POSTGRES_DB      — PostgreSQL database name (e.g. minigram)
#   DATABASE_URL     — Full connection string in the format:
#                      postgresql://USER:PASSWORD@postgres:5432/DB
#                      (postgres is the Kubernetes service name — leave as-is)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: minigram-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "minigram.labels" . | nindent 4 }}
type: Opaque
data:
  # Replace each value below with:  echo -n "your-actual-value" | base64

  # A long random string, e.g.: openssl rand -hex 32 | base64
  JWT_SECRET: "REPLACE_WITH_BASE64_ENCODED_JWT_SECRET"

  # e.g. echo -n "minigram" | base64  →  bWluaWdyYW0=
  POSTGRES_USER: "REPLACE_WITH_BASE64_ENCODED_POSTGRES_USER"

  # e.g. echo -n "str0ngP@ssw0rd" | base64
  POSTGRES_PASSWORD: "REPLACE_WITH_BASE64_ENCODED_POSTGRES_PASSWORD"

  # e.g. echo -n "minigram" | base64  →  bWluaWdyYW0=
  POSTGRES_DB: "REPLACE_WITH_BASE64_ENCODED_POSTGRES_DB"

  # Full URL: postgresql://USER:PASSWORD@postgres:5432/DB
  # e.g. echo -n "postgresql://minigram:str0ngP@ssw0rd@postgres:5432/minigram" | base64
  DATABASE_URL: "REPLACE_WITH_BASE64_ENCODED_DATABASE_URL"
