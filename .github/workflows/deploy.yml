name: Build, Push & Deploy to EKS (Sandbox)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REGISTRY: sauravmehta
  PREFIX: content-scrapper
  CLUSTER_NAME: minigram
  AWS_REGION: us-east-1
  NAMESPACE: minigram
  HELM_RELEASE: minigram
  HELM_CHART: ./k8s/helm/minigram

jobs:
  # ── Job 1: Build all 7 images in parallel ──────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - telegram-read-service
          - telegram-download-service
          - google-upload-service
          - google-download-service
          - api-gateway
          - ui-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.PREFIX }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── Job 2: Smart deploy — reuses existing cluster if present ───────────────
  deploy:
    name: Create Cluster & Deploy
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install eksctl
        run: |
          ARCH=amd64
          PLATFORM=$(uname -s)_$ARCH
          curl -sLO "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$PLATFORM.tar.gz"
          tar -xzf "eksctl_$PLATFORM.tar.gz" -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin

      # ── Smart cluster creation: skip if already running ──────────────────
      - name: Create EKS cluster if not exists (~15-20 min first time)
        run: |
          if eksctl get cluster --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "✅ Cluster already exists — skipping creation, updating kubeconfig"
            aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          else
            echo "🚀 No cluster found — creating fresh cluster..."
            eksctl create cluster -f k8s/cluster/eksctl-cluster.yaml
          fi

      # ── Smart IAM: attach policies only if not already attached ──────────
      - name: Attach IAM policies to node role (sandbox workaround)
        run: |
          NODE_ROLE=$(aws iam list-roles \
            --query "Roles[?contains(RoleName,'NodeInstanceRole')].RoleName" \
            --output text)
          echo "Node role: $NODE_ROLE"

          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # Create ALB controller policy if missing
          if ! aws iam get-policy --policy-arn "arn:aws:iam::${AWS_ACCOUNT_ID}:policy/AWSLoadBalancerControllerIAMPolicy" 2>/dev/null; then
            echo "Creating ALB controller IAM policy..."
            curl -sSL \
              "https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/v2.7.2/docs/install/iam_policy.json" \
              -o /tmp/alb-iam-policy.json
            aws iam create-policy \
              --policy-name AWSLoadBalancerControllerIAMPolicy \
              --policy-document file:///tmp/alb-iam-policy.json
          else
            echo "✅ ALB controller IAM policy already exists — skipping"
          fi

          # Helper: attach only if not already attached
          attach_if_missing() {
            local ROLE=$1
            local POLICY_ARN=$2
            if aws iam list-attached-role-policies --role-name "$ROLE" \
                --query "AttachedPolicies[?PolicyArn=='$POLICY_ARN'].PolicyArn" \
                --output text | grep -q "$POLICY_ARN"; then
              echo "✅ Already attached: $POLICY_ARN"
            else
              echo "➕ Attaching: $POLICY_ARN"
              aws iam attach-role-policy --role-name "$ROLE" --policy-arn "$POLICY_ARN"
            fi
          }

          attach_if_missing "$NODE_ROLE" "arn:aws:iam::aws:policy/ElasticLoadBalancingFullAccess"
          attach_if_missing "$NODE_ROLE" "arn:aws:iam::aws:policy/AmazonEC2FullAccess"
          attach_if_missing "$NODE_ROLE" "arn:aws:iam::aws:policy/AWSWAFFullAccess"
          attach_if_missing "$NODE_ROLE" "arn:aws:iam::${AWS_ACCOUNT_ID}:policy/AWSLoadBalancerControllerIAMPolicy"

          echo "IAM policies verified."

      # ── Smart ALB controller: install if missing, upgrade if present ──────
      - name: Install or upgrade AWS Load Balancer Controller
        run: |
          VPC_ID=$(aws eks describe-cluster \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'cluster.resourcesVpcConfig.vpcId' \
            --output text)

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          # Always use upgrade --install so stale webhook certs get regenerated
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            -n kube-system \
            --set clusterName=${{ env.CLUSTER_NAME }} \
            --set serviceAccount.create=true \
            --set region=${{ env.AWS_REGION }} \
            --set vpcId="$VPC_ID"

          # Force pod restart to regenerate TLS webhook certificate
          kubectl rollout restart deployment/aws-load-balancer-controller -n kube-system

          kubectl rollout status deployment/aws-load-balancer-controller \
            -n kube-system --timeout=120s

        # ── Clean up orphaned namespace left by a prior failed install ──────────
      - name: Clean up orphaned namespace if no Helm release exists
        run: |
          if ! helm status ${{ env.HELM_RELEASE }} -n ${{ env.NAMESPACE }} 2>/dev/null; then
            if kubectl get namespace ${{ env.NAMESPACE }} 2>/dev/null; then
              echo "⚠️  Orphaned namespace found — deleting so Helm can recreate it cleanly..."
              kubectl delete namespace ${{ env.NAMESPACE }} --wait=true
            fi
          fi

      # ── Smart app deploy: install on first run, upgrade on reruns ─────────
      - name: Deploy or upgrade miniGram via Helm
        run: |
          IMAGE_ARGS="
            --set authService.image=${{ env.REGISTRY }}/${{ env.PREFIX }}-auth-service:${{ github.sha }}
            --set telegramReadService.image=${{ env.REGISTRY }}/${{ env.PREFIX }}-telegram-read-service:${{ github.sha }}
            --set telegramDownloadService.image=${{ env.REGISTRY }}/${{ env.PREFIX }}-telegram-download-service:${{ github.sha }}
            --set googleUploadService.image=${{ env.REGISTRY }}/${{ env.PREFIX }}-google-upload-service:${{ github.sha }}
            --set googleDownloadService.image=${{ env.REGISTRY }}/${{ env.PREFIX }}-google-download-service:${{ github.sha }}
            --set apiGateway.image=${{ env.REGISTRY }}/${{ env.PREFIX }}-api-gateway:${{ github.sha }}
            --set uiService.image=${{ env.REGISTRY }}/${{ env.PREFIX }}-ui-service:${{ github.sha }}
          "

          if helm status ${{ env.HELM_RELEASE }} -n ${{ env.NAMESPACE }} 2>/dev/null; then
            echo "✅ Release already installed — upgrading to new images..."
          else
            echo "🚀 First deploy — installing release..."
          fi

          helm upgrade --install ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            $IMAGE_ARGS \
            --wait \
            --timeout 5m

      # ── Get ALB URL; update README only if URL changed ────────────────────
      - name: Get ALB URL and update README
        run: |
          echo "Waiting for ALB to be provisioned..."
          ALB=""
          for i in $(seq 1 18); do
            ALB=$(kubectl get ingress minigram-ingress -n ${{ env.NAMESPACE }} \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$ALB" ]; then
              break
            fi
            echo "  Still waiting... ($i/18)"
            sleep 10
          done

          if [ -z "$ALB" ]; then
            echo "ALB not ready — README not updated."
            echo "Run: kubectl get ingress minigram-ingress -n ${{ env.NAMESPACE }}"
            exit 0
          fi

          echo ""
          echo "=========================================="
          echo "  App is live at:  http://$ALB"
          echo "=========================================="

          # Only commit if the URL actually changed
          CURRENT=$(grep -oP 'http://k8s-minigram[^\s)]+' README.md || true)
          if [ "$CURRENT" = "http://$ALB" ]; then
            echo "✅ README already has the correct URL — no commit needed."
            exit 0
          fi

          sed -i "s|http://k8s-minigram.*\.elb\.amazonaws\.com|http://$ALB|g" README.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update live app URL to http://$ALB [skip ci]"
          git push

      - name: Verify all pods running
        run: kubectl get pods -n ${{ env.NAMESPACE }}
