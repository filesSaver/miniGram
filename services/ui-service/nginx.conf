server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the gateway so the UI doesn't need to know
    # the gateway's address — everything goes through /api/*
    location /api/ {
        proxy_pass http://api-gateway:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Batch download can take a long time — give it 10 minutes
    location /api/download/batch {
        proxy_pass http://api-gateway:3000/download/batch;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SSE stream for breakdown scan progress
    location ~ ^/api/groups/[^/]+/breakdown/stream$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api-gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # SSE stream for topic breakdown scan progress
    location ~ ^/api/groups/[^/]+/topics/[^/]+/breakdown/stream$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api-gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Full message scan for per-type breakdown — can take minutes for large groups
    location ~ ^/api/groups/[^/]+/breakdown$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Range fetch — can take a while for large ranges
    location ~ ^/api/groups/[^/]+/content/range$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/api/groups/[^/]+/topics/[^/]+/content/range$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # For any route that isn't a real file, serve index.html.
    # This is what makes Angular's router work on page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
