# ── Shared network ─────────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge

# ── Persistent volumes ──────────────────────────────────────────────────────────
volumes:
  pg-data:

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── DB Service ───────────────────────────────────────────────────────────────
  db-service:
    build:
      context: ./services/db-service
      dockerfile: Dockerfile
    image: sauravmehta/content-scrapper-db-service:latest
    environment:
      PORT: 3006
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3006:3006"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Auth Service ─────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    image: sauravmehta/content-scrapper-auth-service:latest
    environment:
      PORT: 3001
      DB_SERVICE_URL: http://db-service:3006
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3001:3001"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      db-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Telegram Read Service ────────────────────────────────────────────────────
  telegram-read-service:
    build:
      context: ./services/telegram-read-service
      dockerfile: Dockerfile
    image: sauravmehta/content-scrapper-telegram-read-service:latest
    environment:
      PORT: 3002
      JWT_SECRET: ${JWT_SECRET}
      DB_SERVICE_URL: http://db-service:3006
    ports:
      - "3002:3002"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy

  # ── Telegram Download Service ────────────────────────────────────────────────
  telegram-download-service:
    build:
      context: ./services/telegram-download-service
      dockerfile: Dockerfile
    image: sauravmehta/content-scrapper-telegram-download-service:latest
    environment:
      PORT: 3003
      JWT_SECRET: ${JWT_SECRET}
      DB_SERVICE_URL: http://db-service:3006
      DOWNLOADS_DESKTOP: /host/Desktop
      DOWNLOADS_DOWNLOADS: /host/Downloads
      DOWNLOADS_CUSTOM: /host/Custom
    ports:
      - "3003:3003"
    volumes:
      - ~/Desktop:/host/Desktop
      - ~/Downloads:/host/Downloads
      - ./downloads/Custom:/host/Custom
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy

  # ── Google Upload Service ────────────────────────────────────────────────────
  google-upload-service:
    build:
      context: ./services/google-upload-service
      dockerfile: Dockerfile
    image: sauravmehta/content-scrapper-google-upload-service:latest
    environment:
      PORT: 3004
    ports:
      - "3004:3004"
    networks:
      - app-network
    restart: unless-stopped

  # ── Google Download Service ──────────────────────────────────────────────────
  google-download-service:
    build:
      context: ./services/google-download-service
      dockerfile: Dockerfile
    image: sauravmehta/content-scrapper-google-download-service:latest
    environment:
      PORT: 3005
    ports:
      - "3005:3005"
    networks:
      - app-network
    restart: unless-stopped

  # ── API Gateway ──────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    image: sauravmehta/content-scrapper-api-gateway:latest
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      READ_SERVICE_URL: http://telegram-read-service:3002
      DOWNLOAD_SERVICE_URL: http://telegram-download-service:3003
      GUPLOAD_SERVICE_URL: http://google-upload-service:3004
      GDOWNLOAD_SERVICE_URL: http://google-download-service:3005
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      telegram-read-service:
        condition: service_started
      telegram-download-service:
        condition: service_started
      google-upload-service:
        condition: service_started
      google-download-service:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  # ── UI Service ───────────────────────────────────────────────────────────────
  ui-service:
    build:
      context: ./services/ui-service
      dockerfile: Dockerfile
    image: sauravmehta/content-scrapper-ui-service:latest
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - app-network
    restart: unless-stopped
